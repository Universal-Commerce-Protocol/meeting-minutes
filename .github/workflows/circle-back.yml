---
name: Meeting Minutes Circle-Back

on:
  pull_request:
    branches: [main]
    paths:
      - "tc/**/*.md"
      - "gc/**/*.md"
  push:
    branches: [main]
    paths:
      - "tc/**/*.md"
      - "gc/**/*.md"
  workflow_dispatch:
    inputs:
      minutes_file:
        description: "Path to meeting minutes Markdown file (e.g., tc/shopping/2026/2026-10-09.md)"
        required: true
        type: string
      apply:
        description: "Actually post comments to open PRs/Issues (false = dry-run preview only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  circle-back:
    name: Circle-Back PRs & Issues
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s .github/scripts -v

      - name: Run Circle-Back
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_MINUTES_FILE: ${{ inputs.minutes_file }}
          INPUT_APPLY: ${{ inputs.apply }}
          ORG_OWNER: ${{ github.repository_owner }}
          ORG_TRIAGE_TOKEN: ${{ secrets.ORG_TRIAGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_FILES=()
          EXTRA_ARGS=()

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_FILES+=("$INPUT_MINUTES_FILE")
            if [ "$INPUT_APPLY" = "true" ]; then
              EXTRA_ARGS+=("--apply")
            fi
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            mapfile -t TARGET_FILES < <(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- 'tc/**/*.md' 'gc/**/*.md' || true)
            if [ -n "$PR_NUMBER" ]; then
              EXTRA_ARGS+=("--preview-pr" "$PR_NUMBER")
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE_SHA" ]; then
              mapfile -t TARGET_FILES < <(git diff-tree --no-commit-id --name-only -r --diff-filter=AM HEAD -- 'tc/**/*.md' 'gc/**/*.md' || true)
            else
              mapfile -t TARGET_FILES < <(git diff --name-only --diff-filter=AM "$BEFORE_SHA" HEAD -- 'tc/**/*.md' 'gc/**/*.md' || true)
            fi
            EXTRA_ARGS+=("--apply")
          fi

          if [ ${#TARGET_FILES[@]} -eq 0 ] || [ -z "${TARGET_FILES[0]}" ]; then
            echo "No added or modified meeting minutes files detected."
            exit 0
          fi

          python3 .github/scripts/circle_back.py \
            --org "$ORG_OWNER" \
            --summary-file summary.md \
            "${EXTRA_ARGS[@]}" \
            "${TARGET_FILES[@]}"

          if [ -f summary.md ]; then
            cat summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
