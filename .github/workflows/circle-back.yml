---
name: Meeting Minutes Circle-Back

on:
  pull_request:
    branches: [main]
    paths:
      - "tc/**/*.md"
      - "gc/**/*.md"
  push:
    branches: [main]
    paths:
      - "tc/**/*.md"
      - "gc/**/*.md"
  workflow_dispatch:
    inputs:
      minutes_file:
        description: "Path to meeting minutes Markdown file (e.g., tc/shopping/2026/2026-10-09.md)"
        required: true
        type: string
      apply:
        description: "Actually post comments to open PRs/Issues (false = dry-run preview only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  circle-back:
    name: Circle-Back PRs & Issues
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s .github/scripts -v

      - name: Run Circle-Back
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_MINUTES_FILE: ${{ inputs.minutes_file }}
          INPUT_APPLY: ${{ inputs.apply }}
          ORG_OWNER: ${{ github.repository_owner }}
          ORG_TRIAGE_TOKEN: ${{ secrets.ORG_TRIAGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/circle_back.py
