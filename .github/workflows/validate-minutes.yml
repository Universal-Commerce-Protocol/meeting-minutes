---
name: Validate Meeting Minutes

on:
  pull_request:
    branches: [main]
    paths:
      - "tc/**/*.md"
      - "gc/**/*.md"
      - ".github/scripts/*validate_minutes.py"
      - ".github/workflows/validate-minutes.yml"
  push:
    branches: [main]
    paths:
      - "tc/**/*.md"
      - "gc/**/*.md"
      - ".github/scripts/*validate_minutes.py"
      - ".github/workflows/validate-minutes.yml"
  workflow_dispatch:
    inputs:
      minutes_file:
        description: "Path to meeting minutes Markdown file (e.g., tc/shopping/2026/2026-10-09.md)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-minutes:
    name: Validate Minutes Structure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run validator unit tests
        run: python3 -m unittest discover -s .github/scripts -p "test_validate_minutes.py" -v

      - name: Validate modified meeting minutes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_MINUTES_FILE: ${{ inputs.minutes_file }}
        run: python3 .github/scripts/validate_minutes.py
